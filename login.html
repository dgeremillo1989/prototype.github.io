<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiiJump - Admin Security Gateway</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; padding: 2.5rem; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; font-size: 1.8rem; text-align: center; color: #ffffff; }
        h1 span { color: #f97316; }
        label { display: block; margin-top: 1.25rem; margin-bottom: 0.3rem; color: #94a3b8; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: #f97316; outline: none; }
        .btn { width: 100%; padding: 0.85rem; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; background: #f97316; color: white; margin-top: 1.5rem; transition: background 0.2s; }
        .btn:hover { background: #ea580c; }
        .error-msg { color: #f87171; font-size: 0.9rem; text-align: center; margin-top: 1rem; display: none; }
        .back-link { text-align: center; margin-top: 1.5rem; }
        .back-link a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Wii<span>Jump</span> Gatekeeper</h1>
        <form id="login-form">
            <label>Administrative Username</label>
            <input type="text" id="username" required autocomplete="off">

            <label>Security Access Password</label>
            <input type="password" id="password" required>

            <div class="error-msg" id="err-box">Invalid credentials. Access Denied.</div>

            <button type="submit" class="btn">Authenticate System Session</button>
        </form>
        <div class="back-link"><a href="/">← Return to Public Check-in Kiosk</a></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errBox = document.getElementById('err-box');
            errBox.style.display = 'none';

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Redirect on success
                window.location.href = '/admin.html';
            } else {
                errBox.innerText = data.message || 'Authentication failed.';
                errBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
